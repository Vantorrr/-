# Реестр источников. Новый канал — ещё один блок.
# kind: fl_rss | habr_rss | workspace_catalog | eis_rss | rss_generic | manual
# enabled: false и kind: manual — источник не опрашивается.

sources:
  - id: fl_ru
    enabled: true
    kind: fl_rss
    min_interval_seconds: 2
    proposal_max_chars: 900
    feeds:
      - url: "https://www.fl.ru/rss/all.xml?category=5"
        label: programming
      - url: "https://www.fl.ru/rss/all.xml?category=2"
        label: sites
      - url: "https://www.fl.ru/rss/all.xml?category=23"
        label: mobile
      - url: "https://www.fl.ru/rss/all.xml?category=9"
        label: 3d

  - id: habr_career
    enabled: true
    kind: habr_rss
    min_interval_seconds: 2
    proposal_max_chars: 900
    feeds:
      - url: "https://career.habr.com/vacancies/rss?currency=RUR&sort=date&type=all&q=Python"
        label: python
      - url: "https://career.habr.com/vacancies/rss?currency=RUR&remote=true&sort=date&type=all&q=React"
        label: react-remote
      - url: "https://career.habr.com/vacancies/rss?currency=RUR&sort=date&type=all&q=CRM"
        label: crm

  - id: workspace
    enabled: true
    kind: workspace_catalog
    min_interval_seconds: 2
    proposal_max_chars: 900
    catalog_url: "https://workspace.ru/tenders/"
    fetch_details: true
    max_details: 8

  - id: eis_zakupki
    enabled: true
    kind: eis_rss
    min_interval_seconds: 5
    timeout_seconds: 20
    proposal_max_chars: 900
    feeds:
      - url: "https://zakupki.gov.ru/epz/order/extendedsearch/rss.html?searchString=%D1%80%D0%B0%D0%B7%D1%80%D0%B0%D0%B1%D0%BE%D1%82%D0%BA%D0%B0+%D0%BF%D1%80%D0%BE%D0%B3%D1%80%D0%B0%D0%BC%D0%BC%D0%BD%D0%BE%D0%B3%D0%BE+%D0%BE%D0%B1%D0%B5%D1%81%D0%BF%D0%B5%D1%87%D0%B5%D0%BD%D0%B8%D1%8F&morphology=on&search-filter=%D0%94%D0%B0%D1%82%D0%B5+%D1%80%D0%B0%D0%B7%D0%BC%D0%B5%D1%89%D0%B5%D0%BD%D0%B8%D1%8F&pageNumber=1&sortDirection=false&recordsPerPage=_10&showLotsInfoHidden=false&sortBy=UPDATE_DATE&fz44=on&fz223=on&af=on&currencyIdGeneral=-1"
        label: software-dev

  - id: profi_ru
    enabled: false
    kind: manual
    proposal_max_chars: 500
    reason: "Условия использования запрещают извлечение данных с сайта. Заказы специалиста видны в личном кабинете, отклик платный. Публичного RSS или API для чтения заказов нет."

  - id: freelance_ru
    enabled: false
    kind: manual
    proposal_max_chars: 900
    reason: "RSS https://freelance.ru/rss/projects.xml на 2026-11-05 отвечает HTTP 404. Открытого API нет, платный Telegram-бот площадки без подписки не подключаем."

  - id: kwork
    enabled: false
    kind: manual
    proposal_max_chars: 900
    reason: "Страница /projects открывается без входа, но официального API или RSS для биржи нет. Отклик требует аккаунт. Встроенное состояние страницы не читаем: это не документированный канал."

  - id: b2b_center
    enabled: false
    kind: manual
    proposal_max_chars: 900
    reason: "Публичный поиск открывается как JS-приложение. Отдельный открытый фид не подтверждён, участие требует регистрацию. Без договора API не подключаем."

  - id: rts_tender
    enabled: false
    kind: manual
    proposal_max_chars: 900
    reason: "С этой машины сайт не ответил по таймауту. Участие в процедурах требует учётную запись и электронную подпись. Открытый фид не подтверждён."

  - id: kontur_zakupki
    enabled: false
    kind: manual
    proposal_max_chars: 900
    reason: "Поиск и карточки отдаются платным API с ключом. Ключа нет. Государственные закупки читаются отдельным источником ЕИС, не через Контур."

  - id: avito_services
    enabled: false
    kind: manual
    proposal_max_chars: 900
    reason: "Официальный API Авито требует client_id и client_secret из кабинета. Ключа нет, страницы объявлений не снимаем."

  - id: telegram_channels
    enabled: false
    kind: manual
    proposal_max_chars: 900
    reason: "Bot API не отдаёт историю чужого канала. Публичные страницы t.me/s не снимаем. Канал подключается отдельно, когда появится доступный боту официальный способ чтения."

  - id: agency_subcontract
    enabled: false
    kind: manual
    proposal_max_chars: 900
    reason: "Нет подтверждённого открытого фида конкретной студии. Чтобы добавить студию, которая сама публикует RSS, создайте источник kind rss_generic с её URL. Выдуманные страницы не обходим."

  - id: company_rfp
    enabled: false
    kind: manual
    proposal_max_chars: 900
    reason: "Коммерческие RFP компаний без открытого фида остаются ручными. Государственные извещения идут через eis_zakupki. Свой RSS добавляется блоком kind rss_generic."
